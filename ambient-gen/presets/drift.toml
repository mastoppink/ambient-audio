# Drift: Dorian sendu dan hangat, melodi lebih aktif, gerak filter lebih terasa. Untuk fokus.
name = "Drift"
seed = 3001
duration_min = 60

[key]
tonic = ["E", "A"]   # daftar pilihan: seed memilih salah satu
mode = "dorian"

[mix]
drone = 0.75
pad = 0.6
melody = 0.3
texture = 0.035

[pad]
brightness = 0.6
width = 0.45
movement = 0.75
chord_seconds = [45, 75]

[drone]
brightness = 0.35
sub = 0.3

[melody]
density = [0.7, 0.85]
decay = 7.0
register = 0.45

[space]
reverb_decay = 9.0
reverb_mix = 0.45
delay_feedback = 0.35
