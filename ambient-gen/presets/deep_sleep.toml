# Deep Sleep: gelap, lambat, hampir tanpa melodi. Untuk tidur.
name = "Deep Sleep"
seed = 1001
duration_min = 60
fungsi = "tidur"

[key]
tonic = "D"
mode = "aeolian"

[mix]
drone = 0.65
pad = 0.5
melody = 0.12
texture = 0.025
cloud = 0.12

[pad]
brightness = [0.28, 0.42]  # rentang: tiap seed sedikit beda warna
width = 0.6
movement = 0.25
chord_seconds = [80, 130]

[drone]
brightness = 0.15
sub = 0.3

[melody]
timbre = "piano"
phrases = 0.15
density = 0.2
decay = 12.0
register = 0.2

[texture]
brightness = 0.2

[space]
reverb_decay = 14.0
reverb_mix = 0.6
delay_feedback = 0.25

[master]
target_lufs = -16.0   # YouTube; sedikit lebih pelan karena untuk tidur

[qc]
profile = "sleep"     # target spektrum lebih gelap

[form]
type = ["calm", "arc", "valley"]   # bentuk lagu yang tenang saja

[variation]
amount = 0.3   # perubahan antar babak tipis, supaya tetap menenangkan

[warmth]
noise = 0.05   # hampir tanpa desis: untuk tidur/meditasi

[cloud]
density = 4.0
length = 0.6    # butir panjang: lembut, tidak berkilau
register = 0.2
