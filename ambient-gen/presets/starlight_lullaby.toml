# Starlight Lullaby: lembut dan manis. Untuk tidur anak atau menenangkan diri.
name = "Starlight Lullaby"
seed = 7001
duration_min = 60
fungsi = "tidur"

[key]
tonic = "A"
mode = "ionian"

[mix]
drone = 0.8
pad = 0.55
melody = 0.15
texture = 0.02
cloud = 0.14

[pad]
brightness = [0.37, 0.47]
width = 0.35
movement = 0.25
life = 0.4
chord_seconds = [70, 110]
chord_weights = { iii = 1.0, vii = 0 }   # hanya chord yang paling manis

[drone]
brightness = 0.2
sub = 0.35

[melody]
thin_end = 0.85      # melodi makin jarang menjelang akhir: tidak membangunkan
timbre = "piano"
phrases = 0.3
consonance = 1.0
density = 0.35
decay = 11.0
register = 0.4

[texture]
brightness = 0.25

[space]
reverb_decay = 12.0
reverb_mix = 0.55

[form]
type = ["calm", "arc"]
amount = 0.35

[master]
target_lufs = -16.0

[qc]
profile = "sleep"

[variation]
amount = 0.3

[warmth]
noise = 0.05   # hampir tanpa desis: untuk tidur/meditasi

[cloud]
density = 5.0
length = 0.5
register = 0.4

[comfort]
breath = 0.5          # napas: volume & kilau naik-turun pelan
breath_period = 16.0
tame = 0.9            # redam denting tajam 2-6 kHz
