# Lunar Haze: kabut bulan. Lydian yang digelapkan, nada lembut tanpa denting, sangat pelan. Untuk tidur.
name = "Lunar Haze"
seed = 10001
duration_min = 60
fungsi = "tidur"

[key]
tonic = ["F", "G"]
mode = "lydian"

[mix]
drone = 0.7
pad = 0.55
melody = 0.1
texture = 0.02
cloud = 0.1

[pad]
brightness = [0.38, 0.48]
width = 0.65
movement = 0.2
chord_seconds = [90, 140]

[drone]
brightness = 0.15
sub = 0.3

[melody]
thin_end = 0.85      # melodi makin jarang menjelang akhir: tidak membangunkan
timbre = "soft"      # nada lembut: tanpa serangan tajam
phrases = 0.1
density = 0.15
decay = 14.0
register = 0.25

[texture]
brightness = 0.15

[space]
reverb_decay = 15.0
reverb_mix = 0.62
delay_feedback = 0.2

[master]
target_lufs = -16.0

[qc]
profile = "sleep"

[form]
type = ["calm", "valley"]

[variation]
amount = 0.25

[warmth]
noise = 0.05

[cloud]
density = 3.0
length = 0.7
register = 0.15

[comfort]
breath = 0.5          # napas: volume & kilau naik-turun pelan
breath_period = 16.0
tame = 0.9            # redam denting tajam 2-6 kHz
